name: docker-smoke-test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t fitness-counter:ci .

      - name: Run on sample video
        run: |
          mkdir -p output
          docker run --rm \
            -v "$PWD/samples:/data/input:ro" \
            -v "$PWD/output:/data/output" \
            fitness-counter:ci \
            --video /data/input/squat-sample-6s.mp4 \
            --exercise squat \
            --output /data/output/squat-out.mp4

      - name: Check output exists
        run: test -s output/squat-out.mp4
